name: Sjekk NFF resale-billetter

on:
  schedule:
    - cron: "*/10 * * * *"   # hvert 10. minutt
  workflow_dispatch:          # lar deg ogsa kjore den manuelt fra GitHub

permissions:
  contents: write

jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install requests

      - name: Kjor sjekk
        env:
          ENABLE_EPOST: "true"
          EPOST_AVSENDER: ${{ secrets.EPOST_AVSENDER }}
          EPOST_APP_PASSORD: ${{ secrets.EPOST_APP_PASSORD }}
          EPOST_MOTTAKER: ${{ secrets.EPOST_MOTTAKER }}
          ENABLE_PUSH: "true"
          NTFY_EMNE: ${{ secrets.NTFY_EMNE }}
        run: python sjekk_billetter.py

      - name: Lagre status tilbake til repoet
        run: |
          git config user.name "billett-varsler-bot"
          git config user.email "actions@github.com"
          git add siste_status.txt
          git diff --staged --quiet || git commit -m "Oppdater status"
          git push
