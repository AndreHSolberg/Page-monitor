name: Diagnose - test resale item URLs
 
on:
  workflow_dispatch:
 
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install requests
 
      - name: Run diagnose
        run: python diagnose.py
 
